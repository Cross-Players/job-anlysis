# Phục vụ bản build tĩnh của Next.js (output: 'export'). Nén gzip/zstd do Caddy ở phía trước lo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Trang chủ chuyển thẳng sang Tổng quan, không cần chờ JS
    location = / { return 302 /overview; }

    # File có hash trong tên: cache vĩnh viễn
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Số liệu do crawler xuất mỗi đêm (thư mục mount từ /srv/job-analysis/data): luôn kiểm tra bản mới
    location /data/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # HTML và dữ liệu RSC (.txt): luôn kiểm tra bản mới sau mỗi lần deploy
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
